name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out UnStep
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out public Self Forcing scheduler
        uses: actions/checkout@v4
        with:
          repository: guandeh17/Self-Forcing
          ref: main
          path: assets/source/Self-Forcing-main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Check Python and shell syntax
        run: |
          python -m compileall -q unstep runtime scripts tests
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Test clean-cache input and output arithmetic
        run: python -m unittest discover -s tests -v
