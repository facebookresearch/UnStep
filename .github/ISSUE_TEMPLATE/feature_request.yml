name: Feature request
description: Suggest a capability or improvement.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What would you like to do with UnStep that is not currently supported?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Describe the behavior you would like and any alternatives you considered.
    validations:
      required: true
