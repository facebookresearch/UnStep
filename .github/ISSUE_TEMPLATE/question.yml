name: Usage question
description: Ask about installing, running, or evaluating UnStep.
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to do and which instructions you followed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant configuration
      description: Include commands, settings, and software versions if they help explain your question.
