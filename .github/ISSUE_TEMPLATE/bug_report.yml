name: Bug report
description: Report an installation, generation, or evaluation problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the command, configuration changes, and steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, GPU, Python, PyTorch, CUDA, and FlashAttention versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Include the relevant error or traceback. Remove private information before posting.
      render: text
